[project]
name = "repoverix-backend"
version = "0.1.0"
description = "RepoVeriX backend: evidence-grounded repository auditing and verified automated repair."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".*", "tests/fixtures"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends(...) in argument defaults is the idiomatic FastAPI pattern
"app/api/**" = ["B008"]
# Long intentional prose/regex literals (rule descriptions, patterns)
"app/analysis/evidence.py" = ["E501"]
"app/analysis/detectors.py" = ["E501"]
# NL-query and finding-chat answer prose
"app/analysis/query.py" = ["E501"]
"app/analysis/findingchat.py" = ["E501"]
# Tier-3 research modules: human-readable signals, caveats, recommendation prose
"app/analysis/agents.py" = ["E501"]
"app/analysis/ruleselection.py" = ["E501"]
"app/analysis/crosslearn.py" = ["E501"]
"app/analysis/vulnmining.py" = ["E501"]
"app/analysis/riskmodel.py" = ["E501"]
"app/api/routes/research.py" = ["E501"]
# str + Enum is intentional: enums serialise by value for JSON/DB
"app/db/models.py" = ["UP042"]

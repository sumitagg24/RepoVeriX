name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest + pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Ruff lint
        run: ruff check app tests

      - name: Pytest
        run: python -m pytest tests/ -q

      - name: pip-audit (dependency vulnerability scan)
        run: pip-audit --skip-editable --ignore-vuln GHSA-jq4v-f5q6-mjqq || true
        # || true: audit failures do not block CI but are visible in the log.
        # Remove `|| true` to enforce hard failure on known vulnerabilities.

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Tests
        run: npm test -- --runInBand --passWithNoTests

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: npm audit (dependency vulnerability scan)
        run: npm audit --audit-level=moderate || true
        # || true: surfaces findings in the log but does not fail the build.
        # Remove `|| true` to enforce hard failure on moderate/high vulns.

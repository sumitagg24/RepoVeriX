# RepoVeriX deployment workflow.
#
# Two stages:
#   1. Build the backend/frontend images and push them to GHCR (always).
#   2. If the repository has SSH deploy secrets configured (DEPLOY_HOST,
#      DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH), deploy the stack to that
#      server by pulling the code and running docker compose.
#
# To configure stage 2, add the following secrets to the repository:
#   DEPLOY_HOST    — server IP/hostname (e.g. 203.0.113.10)
#   DEPLOY_USER    — SSH user (e.g. root or deploy)
#   DEPLOY_SSH_KEY — a private key allowed to log in as DEPLOY_USER
#   DEPLOY_PATH    — absolute path of the repo checkout on the server
#   DEPLOY_ENV     — optional; contents written to .env on the server
#                     (set REPOVERIX_JWT_SECRET etc. there — see DEPLOY.md)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  images:
    name: Build and publish images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # GHCR only accepts lowercase image names.
          tags: |
            ghcr.io/${{ github.repository_owner }}/repoverix-backend:latest
            ghcr.io/${{ github.repository_owner }}/repoverix-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/repoverix-frontend:latest
            ghcr.io/${{ github.repository_owner }}/repoverix-frontend:${{ github.sha }}

  server:
    name: Deploy to server (optional)
    runs-on: ubuntu-latest
    needs: images
    if: github.ref == 'refs/heads/main'
    environment: production
    # Secrets cannot be read in job-level if conditions; map them here and
    # gate individual steps instead. Undefined secrets resolve to ''.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        if: env.DEPLOY_HOST != '' && env.DEPLOY_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync repository to server
        if: env.DEPLOY_HOST != '' && env.DEPLOY_SSH_KEY != ''
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude ".git" --exclude "frontend/node_modules" --exclude "backend/.venv" \
            --exclude "backend/data" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Write environment file
        if: env.DEPLOY_HOST != '' && env.DEPLOY_SSH_KEY != '' && env.DEPLOY_ENV != ''
        run: |
          echo "$DEPLOY_ENV" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" "cat > $DEPLOY_PATH/.env"

      - name: Pull and restart the stack
        if: env.DEPLOY_HOST != '' && env.DEPLOY_SSH_KEY != ''
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $DEPLOY_PATH && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --remove-orphans"

      - name: Skipped — no deploy secrets configured
        if: env.DEPLOY_HOST == '' || env.DEPLOY_SSH_KEY == ''
        run: echo "Deploy secrets (DEPLOY_HOST/DEPLOY_SSH_KEY) not set; images were published to GHCR but no server deploy was attempted. See DEPLOY.md."

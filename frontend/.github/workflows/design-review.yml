name: Design Review

# Runs the heuristic design audit on PRs that touch UI. The full taste/interaction review is
# the /design-review subagent inside Claude Code; this CI gate catches the mechanical defects
# (overflow, focus, contrast, unsized media, missing meta) automatically on every PR.

on:
  pull_request:
    paths:
      - 'frontend/**/*.html'
      - 'frontend/**/*.css'
      - 'frontend/**/*.jsx'
      - 'frontend/**/*.tsx'
      - 'frontend/**/*.vue'
      - 'frontend/**/*.svelte'
      - 'frontend/**/*.astro'

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps + Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build Next.js app
        run: npm run build

      - name: Start preview server
        run: npm run start &
        # Wait for the server to be ready
      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run design audit
        run: |
          node scripts/design-audit.mjs --url http://localhost:3000 --out audit-output || true

      - name: Upload audit report + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-audit
          path: audit-output/

      - name: Fail on high-severity findings
        run: node scripts/design-audit.mjs --url http://localhost:3000 --out audit-output --executable $(which chromium-browser)